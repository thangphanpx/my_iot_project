name: my_iot_project
description: IoT Monitoring Dashboard
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Network & IoT
  dio: ^5.4.0
  mqtt_client: ^10.0.0
  web_socket_channel: ^3.0.3
  
  # State Management
  provider: ^6.1.0
  
  # UI & Charts
  fl_chart: ^1.1.1
  intl: ^0.20.2
  
  # Utils
  universal_html: ^2.2.4
  shared_preferences: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true